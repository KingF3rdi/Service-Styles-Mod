plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

def mcCompat = project.findProperty('mc_compat') ?: 'v12111'

sourceSets {
	main {
		java {
			srcDir "src/compat/${mcCompat}/java"
		}
		resources {
			srcDir "src/compat/${mcCompat}/resources"
		}
	}
}

loom {
	mods {
		hugoservice {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", project.minecraft_dep
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_dep": project.minecraft_dep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:none', '-nowarn']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from("LICENSE_Poppins_OFL.txt")
}
