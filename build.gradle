plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

def productKey = (project.findProperty('product') ?: '7auction').toString()
def pinguu = productKey != '7auction'
def productName = pinguu ? 'PinguuTxw Styles' : '7auction Styles'
def productAuthor = pinguu ? 'PinguuTxw' : '7auction'
def productJar = pinguu ? 'PinguuTxw-Styles' : '7auction-Styles'

base {
	archivesName = productJar
}

def mcCompat = project.findProperty('mc_compat') ?: 'v12111'

sourceSets {
	main {
		java {
			srcDir "src/compat/${mcCompat}/java"
		}
		resources {
			srcDir "src/compat/${mcCompat}/resources"
		}
	}
}

loom {
	mods {
		hugoservice {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", project.minecraft_dep
	inputs.property "product_name", productName
	inputs.property "product_author", productAuthor
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_dep": project.minecraft_dep, "product_name": productName, "product_author": productAuthor
	}
	filesMatching("assets/hugoservice/lang/*.json") {
		expand "product_name": productName
	}
	filesMatching("hugoservice/BUILD.txt") {
		expand "product_name": productName, "product_knives": pinguu ? "3D knives, lyrics 20 blocks in front of the skin." : "No knives."
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:none', '-nowarn']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from("LICENSE_Poppins_OFL.txt")
}
