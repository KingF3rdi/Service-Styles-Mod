plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

def mcCompat = project.findProperty('mc_compat') ?: 'v12111'
def legacy1215 = mcCompat in ['v1215', 'v1214', 'v1213', 'v1211']
def modernMc = project.minecraft_version.toString().startsWith('26')

sourceSets {
	main {
		java {
			srcDir "src/compat/${mcCompat}/java"
			if (legacy1215) {
				exclude 'dev/hugoservice/mixin/FogRendererMixin.java'
				exclude 'dev/hugoservice/mixin/SkyRenderingMixin.java'
				exclude 'dev/hugoservice/mixin/WorldRendererMixin.java'
				exclude 'dev/hugoservice/mixin/InGameHudMixin.java'
			}
		}
		resources {
			srcDir "src/compat/${mcCompat}/resources"
		}
	}
}

loom {
	mods {
		hugoservice {
			sourceSet sourceSets.main
		}
	}
	if (modernMc) {
		useIntermediateMappings = true
		intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
	}
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (modernMc) {
		mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
	} else {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", project.minecraft_dep
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_dep": project.minecraft_dep
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:none', '-nowarn']
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from("LICENSE_Poppins_OFL.txt")
}
